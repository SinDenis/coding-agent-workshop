[project]
name = "coding-agent-workshop"
version = "0.1.0"
description = "От HTTP-запроса к агентскому циклу и Plan Mode"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<0.29", "python-dotenv>=1.1,<2"]

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.12,<0.13"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
